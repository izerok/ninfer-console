# ninfer-console — a monitoring panel plus a management console for
# NInfer. It does not deploy, download or start any inference
# framework. It polls a NInfer server that is already running
# somewhere else; parameter edits in the management view apply
# nothing, and the one live action — switching models — goes through
# the engine's own router API when the engine runs in router mode.
#
# Default wiring (most common case: NInfer published on the host at :8080):
#   panel -> host.docker.internal:8080 -> your NInfer container
# On Linux Docker this needs the extra_hosts line below (host-gateway).
# To point the panel elsewhere, use the Settings card in the panel UI —
# do not edit this file for the address. The saved address is stored in
# the ninfer-panel-data volume and survives restarts and recreates.
#
# Ports: the panel itself is published loopback-only on the host
# (127.0.0.1:8091). Do not change it to 0.0.0.0 without an
# authenticated reverse proxy in front (see SECURITY.md).
#
# GPU: the deploy block below is ONLY so nvidia-smi works inside the
# container for the GPU cards. It does not run inference. If your host
# has no nvidia-container-toolkit, delete the deploy block — the panel
# still runs, the GPU cards will just say nvidia-smi unavailable.
#
# Host memory: mounting /proc read-only lets the panel read the HOST's
# meminfo. Without it, system memory is reported unavailable on purpose
# (the container's own meminfo would be the wrong machine's numbers).

services:
  ninfer-panel:
    build: .
    image: ninfer-console:local
    container_name: ninfer-panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:8091:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # NInfer address is NOT hardcoded here anymore: change it from the
      # panel UI (Settings card). The saved value lives in the data volume
      # and wins over NINFER_BASE_URL / the image default on later runs.
      # Only if your NInfer requires an API key; leave empty otherwise.
      NINFER_API_KEY: ${NINFER_API_KEY:-}
      PANEL_PORT: "8091"
      POLL_INTERVAL: "2"
      # Optional (ninfer-console): models dir, read-only, so the
      # management view can discover which .ninfer files actually exist
      # and measure their sizes. Pairs with the volumes mount below.
      # The panel never writes to this directory.
      # PANEL_MODELS_DIR: "/models"
      # Optional: real per-request rows from NInfer's request log. Start
      # NInfer with --request-log-jsonl <file>, mount that file read-only
      # (see the volumes note below) and uncomment:
      # PANEL_REQUEST_LOG: "/app/request-log.jsonl"
    volumes:
      # Optional but recommended for true host memory numbers.
      - /proc:/host/proc:ro
      # Optional models mount (pairs with PANEL_MODELS_DIR above):
      # - /path/to/models:/models:ro
      # Optional request-log mount (pairs with PANEL_REQUEST_LOG above):
      # - /path/to/ninfer-requests.jsonl:/app/request-log.jsonl:ro
      # Persists the history curve (data/history.jsonl) so a page refresh,
      # a container restart, or a recreate does not wipe it. Without this
      # volume the file lives in the container layer: refresh-safe, but
      # lost on recreate.
      - ninfer-panel-data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ninfer-panel-data:
