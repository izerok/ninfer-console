<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>NInfer</title>
<!--
  本页按 Niko1221/Strata apps/host 的 Monitor 屏 1:1 复刻版式（MIT 许可），
  数据源换成本地 NInfer。版式、卡片顺序、文案均照 Strata 的来：
  模型状态卡（五态 badges + 模型进度条）→ 9 张指标卡（4 列）→
  上下文占用 + 当前请求（含过去 1 小时观测记录）→ 对话缓存。
  Strata 有而 NInfer 不提供的字段不造数：单请求进度（条形为进行中动画）、
  专家缓存（改用 KV 缓存）、PCIe 传输速率（只给链路）；历史请求一栏是
  面板自己观测的过去 1 小时记录，不是 NInfer 原生历史。
  完整适配清单见 README。
-->
<style>
  :root{
    --st-bg:#101418; --st-surface:#1a1f26; --st-surface-2:#222833;
    --st-line:rgba(255,255,255,.14); --st-track:rgba(255,255,255,.12);
    --st-ink:#e6e8eb; --st-ink-muted:#9aa0a6;
    --st-accent:#10b981; --st-accent-tint:rgba(16,185,129,.16); --st-accent-text:#34d399;
    --st-info:#38bdf8; --st-info-tint:rgba(56,189,248,.16); --st-info-text:#7dd3fc;
    --st-warn:#f59e0b; --st-warn-tint:rgba(245,158,11,.16); --st-warn-text:#fbbf24;
    --st-danger:#f87171; --st-danger-tint:rgba(248,113,113,.16); --st-danger-text:#fca5a5;
  }
  [data-theme="light"]{
    --st-bg:#f2f4f7; --st-surface:#ffffff; --st-surface-2:#eef1f4;
    --st-line:rgba(0,0,0,.12); --st-track:rgba(0,0,0,.12);
    --st-ink:#1a2027; --st-ink-muted:#5b6773;
    --st-accent:#10b981; --st-accent-tint:rgba(16,185,129,.14); --st-accent-text:#047857;
    --st-info:#0284c7; --st-info-tint:rgba(2,132,199,.12); --st-info-text:#0369a1;
    --st-warn:#d97706; --st-warn-tint:rgba(217,119,6,.14); --st-warn-text:#b45309;
    --st-danger:#dc2626; --st-danger-tint:rgba(220,38,38,.12); --st-danger-text:#b91c1c;
  }
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--st-bg);color:var(--st-ink);margin:0;padding:24px;max-width:1280px;margin-left:auto;margin-right:auto}
  h1{font-size:24px;margin:0 0 4px}
  h2{font-size:16px;margin:0}
  .muted{color:var(--st-ink-muted)} .small{font-size:12px} .xs{font-size:10px}
  .title-detail{color:var(--st-ink-muted);font-size:14px;margin-bottom:20px}
  .stack{display:flex;flex-direction:column;gap:16px}
  .st-card{background:var(--st-surface);border:1px solid var(--st-line);border-radius:20px;padding:20px;box-shadow:none}
  /* 模型状态卡：Strata monitor-state */
  .monitor-state{display:flex;flex-direction:column;gap:14px}
  .monitor-state__head{display:flex;align-items:center;flex-wrap:wrap;gap:12px 18px}
  .monitor-state__badges{display:flex;flex-wrap:wrap;gap:7px}
  .st-badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--st-line);opacity:.38}
  .st-badge[data-active="true"]{opacity:1}
  .st-badge[data-phase="reading"]{background:var(--st-info-tint);color:var(--st-info-text);border-color:transparent}
  .st-badge[data-phase="generating"], .st-badge[data-phase="idle"][data-active="true"]{background:var(--st-accent-tint);color:var(--st-accent-text);border-color:transparent}
  .st-badge[data-phase="queued"]{background:var(--st-warn-tint);color:var(--st-warn-text);border-color:transparent}
  .st-badge[data-phase="error"]{background:var(--st-danger-tint);color:var(--st-danger-text);border-color:transparent}
  .monitor-state__reading{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 18px}
  .num{font-variant-numeric:tabular-nums}
  .st-progress{height:8px;border-radius:999px;background:var(--st-track);overflow:hidden}
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .theme-btn{background:var(--st-surface);color:var(--st-ink);border:1px solid var(--st-line);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
  .theme-btn:hover{border-color:var(--st-ink-muted)}
  .hist-head{display:flex;align-items:center;flex-wrap:wrap;gap:12px}
  .hist-head .range{margin-left:auto;display:flex;gap:6px}
  .range button{background:transparent;color:var(--st-ink-muted);border:1px solid var(--st-line);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer}
  .range button[data-active="true"]{background:var(--st-accent-tint);color:var(--st-accent-text);border-color:transparent}
  .hist-legend{display:flex;gap:8px;font-size:12px;color:var(--st-ink-muted);flex-wrap:wrap}
  .dim-btn{background:transparent;color:var(--st-ink-muted);border:1px solid var(--st-line);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
  .dim-btn[data-active="true"]{color:var(--st-ink);border-color:var(--st-accent)}
  .dim-btn[data-active="false"]{opacity:.55}
  .hist-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  #histCanvasRates{width:100%;height:220px;display:block}
  #histCanvasUtil{width:100%;height:160px;display:block}
  #histCanvasCum{width:100%;height:150px;display:block}
  .hist-tip{position:absolute;pointer-events:none;background:var(--st-surface-2);border:1px solid var(--st-line);border-radius:8px;padding:6px 10px;font-size:12px;display:none;white-space:nowrap}
  .hist-wrap{position:relative}
  #gaugeTrack{stroke:var(--st-track)}
  .st-progress > div{height:100%;background:var(--st-accent);border-radius:999px}
  .st-progress > div.info{background:var(--st-info)}
  .st-progress > div.indet{width:40%;animation:indet 1.4s ease-in-out infinite}
  @keyframes indet{0%{margin-left:0}50%{margin-left:60%}100%{margin-left:0}}
  .bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--st-ink-muted);margin-bottom:6px}
  /* 指标卡：Strata monitor-metrics / monitor-metric */
  .monitor-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
  .monitor-metric{min-width:0;min-height:172px;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
  .st-metric__label{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px}
  .monitor-metric__source{margin-left:auto;color:var(--st-ink-muted);font-size:10px;font-weight:400}
  .st-metric__value{font-size:clamp(22px,2.3vw,32px);font-weight:700;overflow-wrap:anywhere}
  .st-metric__unit{font-size:12px;white-space:nowrap;font-weight:400}
  .monitor-metric__sub{margin-top:10px;min-height:16px;line-height:1.45;overflow-wrap:anywhere;font-size:12px;color:var(--st-ink-muted)}
  .monitor-speed-values{display:flex;justify-content:space-between;gap:10px}
  .monitor-speed-values > div{min-width:0}
  .monitor-speed-values > div:last-child{text-align:right}
  .monitor-speed-values .st-metric__value{font-size:clamp(20px,2vw,28px)}
  .monitor-spark{margin-top:auto;height:32px;flex:none}
  .monitor-spark svg{display:block;width:100%;height:32px;overflow:visible}
  /* 上下文 + 最近请求：Strata monitor-context-requests */
  .monitor-context-requests{display:grid;grid-template-columns:minmax(250px,1fr) minmax(0,2.4fr);gap:16px;align-items:stretch}
  .monitor-context{display:flex;flex-direction:column;gap:8px}
  .monitor-context__gauge{align-self:center;margin:10px auto 16px;text-align:center;position:relative;width:150px;height:150px}
  .monitor-context__gauge .gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .monitor-context__gauge .gauge-center b{font-size:28px}
  .monitor-bar-reading{display:flex;justify-content:space-between;gap:12px;font-size:12px;margin-top:8px}
  .monitor-bar-reading > span:last-child{text-align:right}
  .monitor-requests{min-width:0;display:flex;flex-direction:column;gap:14px}
  .monitor-request-table{overflow:auto;max-height:320px}
  .st-table{width:100%;min-width:630px;font-size:12px;border-collapse:collapse}
  .st-table th{font-size:10px;font-weight:500;letter-spacing:.03em;white-space:nowrap;padding:10px 8px;text-align:left;color:var(--st-ink-muted);border-bottom:1px solid var(--st-line)}
  .st-table td{padding:12px 8px;white-space:nowrap;border-bottom:1px solid var(--st-line)}
  .st-table .num{text-align:right}
  .st-table tr.req-past{color:var(--st-ink-muted)}
  .monitor-cache{display:flex;flex-direction:column;gap:16px}
  .monitor-cache-bars{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .monitor-cache-facts{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin:0}
  .monitor-cache-facts > div{display:flex;justify-content:space-between;gap:16px;font-size:12px}
  .monitor-cache-facts dt{color:var(--st-ink-muted)}
  .monitor-cache-facts dd{margin:0;text-align:right}
  .warn{border:1px solid var(--st-danger);border-radius:12px;padding:12px;margin-bottom:16px;font-size:13px}
  .update-banner{border:1px solid var(--st-accent);border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13px;background:var(--st-accent-tint)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 16px}
  .modal.open{display:flex}
  .modal-card{background:var(--st-surface);border:1px solid var(--st-line);border-radius:16px;padding:20px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .update-banner a{color:var(--st-accent-text);font-weight:600}
  /* 管理视图（ninfer-console v0.1）：沿用监控页的卡片/徽标/配色语言 */
  .view-nav{display:flex;gap:6px}
  .view-nav button{background:transparent;color:var(--st-ink-muted);border:1px solid var(--st-line);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
  .view-nav button[data-active="true"]{background:var(--st-accent-tint);color:var(--st-accent-text);border-color:transparent;font-weight:600}
  .mg-head{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px}
  .mg-head .spacer{flex:1}
  .mg-badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--st-line);color:var(--st-ink-muted)}
  .mg-badge.on{background:var(--st-accent-tint);color:var(--st-accent-text);border-color:transparent}
  .mg-badge.info{background:var(--st-info-tint);color:var(--st-info-text);border-color:transparent}
  .mg-badge.warn{background:var(--st-warn-tint);color:var(--st-warn-text);border-color:transparent}
  .mg-badge.danger{background:var(--st-danger-tint);color:var(--st-danger-text);border-color:transparent}
  .mg-btn{background:var(--st-surface-2);color:var(--st-ink);border:1px solid var(--st-line);border-radius:999px;padding:8px 16px;font-size:13px;cursor:pointer}
  .mg-router-cell{display:inline-flex;gap:6px;align-items:center}
  .mg-router-cell .mg-btn{padding:5px 12px;font-size:12px}
  .mg-preset-text{width:100%;min-height:280px;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.55;resize:vertical;box-sizing:border-box}
  .mg-btn:hover{border-color:var(--st-ink-muted)}
  .mg-btn.primary{background:var(--st-accent);border-color:transparent;color:#06281c;font-weight:700}
  .mg-btn:disabled{opacity:.45;cursor:default}
  .mg-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 24px;margin-top:16px}
  .mg-facts dt{font-size:12px;color:var(--st-ink-muted);margin-bottom:4px}
  .mg-facts dd{margin:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
  .mg-model-row{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--st-line);flex-wrap:wrap}
  .mg-model-row:last-child{border-bottom:none}
  .mg-model-name{font-weight:600;font-size:14px}
  .mg-model-meta{font-size:12px;color:var(--st-ink-muted)}
  .mg-model-row .spacer{flex:1}
  .mg-group{border-top:1px solid var(--st-line);padding-top:16px;margin-top:16px}
  .mg-group:first-of-type{border-top:none;padding-top:4px;margin-top:8px}
  .mg-group h3{font-size:13px;margin:0 0 12px;color:var(--st-ink-muted);font-weight:600}
  .mg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 20px}
  .mg-field{display:flex;flex-direction:column;gap:6px;min-width:0}
  .mg-field label{font-size:12px;color:var(--st-ink-muted)}
  .mg-field .ctl{background:var(--st-surface-2);border:1px solid var(--st-line);border-radius:12px;padding:9px 12px;font-size:13px;color:var(--st-ink);width:100%}
  .mg-field.changed .ctl{border-color:var(--st-warn);box-shadow:0 0 0 1px var(--st-warn)}
  .mg-field .hint{font-size:11px;color:var(--st-ink-muted)}
  .mg-field.changed .hint{color:var(--st-warn-text)}
  .mg-field.disabled{opacity:.45}
  .mg-field .chk{display:flex;align-items:center;gap:8px;background:var(--st-surface-2);border:1px solid var(--st-line);border-radius:12px;padding:9px 12px;font-size:13px}
  .mg-issues{font-size:13px;line-height:1.7;margin-top:12px}
  .mg-issues .err{color:var(--st-danger-text)}
  .mg-issues .wrn{color:var(--st-warn-text)}
  .mg-issues .ok{color:var(--st-accent-text)}
  .mg-diff-table{width:100%;font-size:13px;border-collapse:collapse;margin:14px 0}
  .mg-diff-table td{padding:9px 8px;border-bottom:1px solid var(--st-line)}
  .mg-diff-table td.k{color:var(--st-ink-muted);width:34%}
  .mg-diff-table .old{color:var(--st-ink-muted);text-decoration:line-through}
  .mg-diff-table .new{color:var(--st-warn-text);font-weight:600}
  .mg-warn-box{border:1px solid var(--st-warn);border-radius:12px;padding:12px 14px;font-size:13px;background:var(--st-warn-tint);margin:12px 0}
  .mg-pre{background:var(--st-surface-2);border:1px solid var(--st-line);border-radius:12px;padding:12px;font-size:11px;overflow:auto;max-height:300px;white-space:pre}
  @media(max-width:900px){.mg-grid{grid-template-columns:repeat(2,1fr)}.mg-facts{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:1100px){.monitor-metric{padding:16px}.monitor-metric__source{flex-basis:100%;margin:0}}
  @media(max-width:950px){.monitor-context-requests{grid-template-columns:1fr}}
  @media(max-width:767px){.monitor-metrics{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.monitor-cache-bars,.monitor-cache-facts{display:flex;flex-direction:column}}
</style>
</head>
<body>
<div class="stack monitor-dashboard">
  <header class="page-head">
    <div>
      <h1 data-i18n="title"></h1>
      <div class="title-detail" id="titleDetail">—</div>
      <div class="small muted" id="versionText"></div>
      <div class="small muted" id="uptimeText"></div>
    </div>
    <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
      <nav class="view-nav">
        <button type="button" id="viewMonitorBtn" data-active="true" data-i18n="mgViewMonitor"></button>
        <button type="button" id="viewManageBtn" data-active="false" data-i18n="mgViewManage"></button>
      </nav>
      <button class="theme-btn" id="settingsBtn" type="button" data-i18n="settings"></button>
      <select class="theme-btn" id="langSel" data-i18n-aria="langAria">
        <option value="zh-CN">中文</option>
        <option value="en">English</option>
      </select>
      <button class="theme-btn" id="themeBtn" type="button" data-i18n-aria="themeAria"></button>
    </div>
  </header>

  <div id="err" class="warn" style="display:none"></div>
  <div id="updateBanner" class="update-banner" style="display:none"></div>

  <!-- 设置：单独弹窗，不占主页面位置；NInfer 地址在弹窗里改，不用改 compose -->
  <div id="settingsModal" class="modal" role="dialog" aria-modal="true" data-i18n-aria="settings">
    <div class="modal-card">
      <div style="display:flex;align-items:center;gap:12px">
        <h2 data-i18n="settings" style="margin-right:auto"></h2>
        <button class="theme-btn" id="settingsCloseBtn" type="button" data-i18n-aria="closeAria">×</button>
      </div>
      <p class="small muted"><span data-i18n="currentLabel"></span>：<span class="num" id="currentBase">—</span></p>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap">
        <input id="baseUrlInput" type="url" placeholder="http://host.docker.internal:8080"
          style="flex:1;min-width:260px;background:var(--st-surface-2);color:var(--st-ink);border:1px solid var(--st-line);border-radius:10px;padding:10px 12px;font-size:14px"/>
        <button class="theme-btn" id="saveBaseBtn" type="button" data-i18n="save"></button>
      </div>
      <div class="small" id="settingsMsg" style="margin-top:10px"></div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center">
        <button class="theme-btn" id="testConnBtn" type="button" data-i18n="testConn"></button>
        <span class="small" id="testConnMsg"></span>
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center">
        <span class="small muted" data-i18n="pollInterval"></span>
        <input id="pollIntervalInput" type="number" min="1" max="10" step="1"
          style="width:70px;background:var(--st-surface-2);color:var(--st-ink);border:1px solid var(--st-line);border-radius:10px;padding:8px 10px;font-size:14px"/>
        <span class="small muted" data-i18n="seconds"></span>
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center">
        <button class="theme-btn" id="checkUpdateBtn" type="button" data-i18n="checkUpdate"></button>
        <span class="small" id="updateCheckMsg"></span>
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center">
        <label class="small muted" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="notifyOfflineChk"/> <span data-i18n="notifyOffline"></span></label>
      </div>
      <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center">
        <label class="small muted" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="hidePcieChk"/> <span data-i18n="hidePcie"></span></label>
        <label class="small muted" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="hideDiskChk"/> <span data-i18n="hideDisk"></span></label>
      </div>
      <p class="small muted" style="margin:10px 0 0" data-i18n="settingsHint"></p>
    </div>
  </div>

  <!-- 模型状态卡 -->
  <section class="st-card monitor-state" data-i18n-aria="modelState">
    <div class="monitor-state__head">
      <h2 data-i18n="modelState"></h2>
      <div class="monitor-state__badges" id="badges">
        <span class="st-badge" data-phase="idle" data-active="false" data-i18n="badgeIdle"></span>
        <span class="st-badge" data-phase="reading" data-active="false" data-i18n="badgeReading"></span>
        <span class="st-badge" data-phase="generating" data-active="false" data-i18n="badgeGenerating"></span>
        <span class="st-badge" data-phase="queued" data-active="false" data-i18n="badgeQueued"></span>
        <span class="st-badge" data-phase="error" data-active="false" data-i18n="badgeError"></span>
      </div>
    </div>
    <div class="monitor-state__reading small">
      <span id="phaseText">—</span>
      <span class="muted num" id="statusDetail"></span>
    </div>
    <div>
      <div class="bar-label"><span data-i18n="modelProgress"></span><span id="progressNote" class="muted"></span></div>
      <div class="st-progress"><div id="progressBar" style="width:0%"></div></div>
    </div>
  </section>

  <!-- 9 张指标卡，顺序与 Strata 一致（速度卡已拆成解码 / 预填充两张） -->
  <div class="monitor-metrics">
    <section class="st-card monitor-metric" data-i18n-aria="decodeSpeed">
      <div class="st-metric__label"><span data-i18n="decodeSpeed"></span><span class="monitor-metric__source" id="decodeSource">—</span></div>
      <div><div class="st-metric__value"><span id="decode">—</span><span class="st-metric__unit"> tok/s</span></div><div class="monitor-metric__sub" id="decodeSub">—</div></div>
      <div class="monitor-spark" id="decodeSpark"></div>
    </section>
    <section class="st-card monitor-metric" data-i18n-aria="prefillSpeed">

<script src="/i18n.js"></script>
<script>
const $ = id => document.getElementById(id);

// 多语言：字典式，不引任何外部库。加一种语言只需在 I18N 里加一节，
// 并在 header 的语言选择框里加一个 option；缺失的 key 回退中文。
// UI strings live in web/i18n.js (loaded below) — do not put them here.
// I18N is a global from i18n.js; applyI18n() fills data-i18n / data-i18n-aria.
let LANG = localStorage.getItem('ninfer-panel-lang') ||
  (navigator.language && navigator.language.toLowerCase().startsWith('zh') ? 'zh-CN' : 'en');
if(!I18N[LANG]) LANG = 'zh-CN';
const T = () => I18N[LANG];
function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = T()[el.dataset.i18n];
    if(v !== undefined) el.textContent = v;
  });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => {
    const v = T()[el.dataset.i18nAria];
    if(v !== undefined) el.setAttribute('aria-label', v);
  });
  document.title = T().title + ' · NInfer';
  document.documentElement.lang = LANG === 'zh-CN' ? 'zh-CN' : 'en';
  const sel = $('langSel'); if(sel) sel.value = LANG;
}

// 主题：默认深色；跟随系统只在用户没手动选过时生效，选择存 localStorage.
(function(){
  const saved = localStorage.getItem('ninfer-panel-theme');
  const theme = saved || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = theme;
  const btn = $('themeBtn');
  const sync = () => { btn.textContent = document.documentElement.dataset.theme === 'light' ? T().themeDark : T().themeLight; };
  sync();
  btn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('ninfer-panel-theme', next);
    sync();
  });
})();
const langSel = $('langSel');
langSel.addEventListener('change', () => {
  LANG = langSel.value in I18N ? langSel.value : 'zh-CN';
  localStorage.setItem('ninfer-panel-lang', LANG);
  applyI18n(); renderUpdateBanner();
  tick(); drawHistory();
});
applyI18n();
// 历史曲线：数据来自后端 /api/history（落盘），刷新不丢。
let histMinutes = 15, histSamples = [];
let _histMarkers = []; // {x, color, text} for events inside the drawn window
// Dimension selection, persisted in localStorage (default: decode + prefill,
// the previous view). Toggling only redraws — samples already carry all dims.
let histDims = (() => {
  try{
    const saved = JSON.parse(localStorage.getItem('ninfer-panel-hist-dims') || 'null');
    if(Array.isArray(saved) && saved.length && saved.every(d => ['decode','prefill','kv','gpu','cum','accept'].includes(d))) return saved;
  }catch(e){ /* fall through to default */ }
  return ['decode', 'prefill', 'cum'];
})();
function syncHistDims(){
  document.querySelectorAll('#histLegend .dim-btn').forEach(b => {
    b.dataset.active = histDims.includes(b.dataset.dim) ? 'true' : 'false';
  });
}
syncHistDims();
document.querySelectorAll('#histLegend .dim-btn').forEach(b => b.addEventListener('click', () => {
  const dim = b.dataset.dim;
  histDims = histDims.includes(dim) ? histDims.filter(d => d !== dim) : [...histDims, dim];
  try{ localStorage.setItem('ninfer-panel-hist-dims', JSON.stringify(histDims)); }catch(e){}
  syncHistDims();
  drawHistory();
}));
document.querySelectorAll('#histRange button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#histRange button').forEach(x => x.dataset.active = 'false');
  b.dataset.active = 'true';
  histMinutes = parseInt(b.dataset.minutes, 10);
  // Bug fix: the old handler only redrew the previous window's samples and
  // waited up to 2 s for the next tick to refetch. Fetch now, then draw.
  fetchHistory().then(drawHistory);
}));
async function fetchHistory(){
  try{
    const j = await (await fetch('/api/history?minutes=' + histMinutes)).json();
    histSamples = j.samples || [];
    // The 7-day range is only real when the backend keeps that long;
    // otherwise the button would promise a window the API clamps away.
    const b7 = $('range10080Btn');
    if(b7) b7.style.display = (j.retention_seconds && j.retention_seconds >= 604800) ? '' : 'none';
  }catch(e){ /* 曲线缺失不影响主面板 */ }
}
// History panels (v0.1.7): one unit per panel, sharing the time axis.
// The old single dual-axis canvas mixed tok/s and % and let a 0/100 GPU
// square wave bury the rate lines; splitting by unit is what makes each
// panel readable. Cumulative output is a 5th legend dimension (field
// "out"), not a separate canvas: toggling it hides its panel, and the
// CSV columns follow the legend selection. The second series in a panel
// is dashed, so series are never distinguished by hue alone (ui-ux-pro-max
// chart guidance: distinct line styles plus direct labels, not color alone).
const HIST_DIMS = {
  decode:{field:'decode', labelKey:'histTipDecode', fill:true, dash:null},
  prefill:{field:'prefill', labelKey:'histTipPrefill', fill:true, dash:[6,4]},
  kv:{field:'kv', labelKey:'histTipKv', fill:false, dash:null},
  gpu:{field:'gpu', labelKey:'histTipGpu', fill:false, dash:[6,4]},
  accept:{field:'accept', labelKey:'histTipAccept', fill:false, dash:[2,3]},
  cum:{field:'out', labelKey:'histTipCum', fill:true, dash:null},
};
function histDimColor(d){
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  return {decode: light ? '#059669' : '#10b981',
    prefill: light ? '#0284c7' : '#38bdf8',
    kv: light ? '#d97706' : '#f59e0b',
    gpu: light ? '#7c3aed' : '#a78bfa',
    cum: light ? '#059669' : '#10b981',
    accept: light ? '#e11d48' : '#fb7185'}[d];
}
function histDimFmt(d, v){
  if(d === 'decode') return fmtRateNum(v) + ' tok/s';
  if(d === 'prefill') return fmtRateRaw(v) + ' tok/s';
  if(d === 'kv' || d === 'gpu' || d === 'accept') return fmtPct1(v);
  return fmtTok(v);

  const now = Date.now();
  if(now - _lastReqHistFetch < 10000 && _pastReqs.length) return;
  _lastReqHistFetch = now;
  try{
    const j = await (await fetch('/api/request-history')).json();
    const all = j.requests || [];
    _pastReqs = all.filter(x => x.status === 'ended').sort((a, b) => b.last - a.last);
    const cutoff = Date.now() / 1000 - 3600;
    _logReqs = (j.log_requests || []).filter(x => x.t >= cutoff).sort((a, b) => b.t - a.t);
    _pastEndedCount = _logReqs.length ? _logReqs.length : _pastReqs.length;
    _activeFirst = {};
    all.filter(x => x.status === 'active').forEach(x => { _activeFirst[x.slot] = x.first; });
    if(_lastSnap) renderReqTable(_lastSnap);
  }catch(e){ /* past requests missing never breaks the main panel */ }
  try{
    const hj = await (await fetch('/api/history?minutes=60')).json();
    _tableHist = hj.samples || [];
    if(_lastSnap) renderReqTable(_lastSnap);
  }catch(e){ /* window averages fall back to — */ }
}
let _prevOnline = null;
async function tick(){
  let s;
  try{ s=await (await fetch('/api/snapshot')).json(); }catch(e){ s={ninfer_ok:false,state:'offline',error:String(e)}; }
  const phase = ninferToStrata(s);
  document.querySelectorAll('#badges .st-badge').forEach(b=>{
    const active = b.dataset.phase===phase || (b.dataset.phase==='queued' && (s.requests?.waiting||0)>0);
    b.dataset.active = active ? 'true' : 'false';
    if(b.dataset.phase==='queued' && (s.requests?.waiting||0)>0) b.textContent=T().badgeQueued+' ('+s.requests.waiting+')';
    else if(b.dataset.phase==='queued') b.textContent=T().badgeQueued;
  });
  $('titleDetail').textContent = s.model || T().noModel;
  $('uptimeText').textContent = has(s.uptime_seconds) ? (T().uptimeLabel + ' ' + fmtDuration(s.uptime_seconds)) : '';
  $('currentBase').textContent = s.ninfer_base_url || '—';
  const err=$('err');
  if(!s.ninfer_ok){ err.style.display='block'; err.textContent=T().errPrefix+(s.error||T().unknown)+T().errSuffix +
    (s.last_ok ? ' · ' + T().lastOnline.replace('{t}', new Date(s.last_ok * 1000).toLocaleTimeString()) +
    ' · ' + T().offlineFor.replace('{d}', fmtDuration(Math.max(0, Date.now() / 1000 - s.last_ok))) : ''); }
  else err.style.display='none';
  const r=s.requests||{}, inst=s.instant||{}, m=s.metrics||{}, ctx=s.context||{};
  let phaseText, detail='';
  if(phase==='idle'){ phaseText=T().phaseIdle; }
  else if(phase==='reading'){ phaseText=T().phaseReading; detail=T().detailPrefilling.replace('{n}', r.prefilling); if(ctx.max_processing_prompt_tokens) detail+=T().detailLongest.replace('{x}', fmtTok(ctx.max_processing_prompt_tokens)); }
  else if(phase==='generating'){ phaseText=T().phaseGenerating; detail=T().detailGenerating.replace('{d}', fmtRateNum(inst.decode_tok_s)).replace('{n}', r.running); }
  else if(phase==='queued'){ phaseText=T().phaseQueued; detail=T().detailQueued.replace('{n}', r.waiting); }
  else { phaseText=T().phaseError; detail=s.error||''; }
  $('phaseText').textContent=phaseText; $('statusDetail').textContent=detail;
  const bar=$('progressBar');
  if(phase==='reading'||phase==='generating'){ bar.className='indet'+(phase==='reading'?' info':''); bar.style.width='40%'; $('progressNote').textContent=T().noProgress; }
  else { bar.className=''; bar.style.width='0%'; $('progressNote').textContent=''; }
  // 解码 / 预填充卡（0.1.4 起拆成两张，各画一条单线迷你曲线）
  $('decode').textContent=fmtRateNum(inst.decode_tok_s);
  $('prefill').textContent=fmtRateRaw(inst.prefill_tok_s);
  $('decodeSub').textContent = phase==='generating' ? T().decodeSubDecoding : T().decodeSubLast;
  $('prefillSub').textContent = phase==='reading' ? T().prefillSubReading : (phase==='generating' ? T().prefillSubGenerating : T().prefillSubLast);
  $('decodeSource').textContent = s.ninfer_ok ? T().measured : T().unavailable;
  $('prefillSource').textContent = s.ninfer_ok ? T().measured : T().unavailable;
  push('decode', inst.decode_tok_s); push('prefill', inst.prefill_tok_s);
  $('decodeSpark').innerHTML = spark(H.decode, '#10b981');
  $('prefillSpark').innerHTML = spark(H.prefill, '#38bdf8');
  // GPU 卡
  const g=(s.gpu&&s.gpu.available)?s.gpu.cards[0]:null;
  $('gpuLoad').textContent=g?fmt(g.util_percent,1):'—';
  $('gpuLoadSub').textContent=g?g.name:T().unavailable;
  $('gpuLoadSource').textContent=g?T().measured:T().unavailable;
  $('vram').textContent=g?fmtBytes(g.mem_used_mb*1048576):'—';
  $('vramUnit').textContent=g?(' / '+fmtBytes(g.mem_total_mb*1048576)):'';
  $('vramSub').textContent=g?g.name:T().unavailable;
  $('vramSource').textContent=g?T().measured:T().unavailable;
  $('temp').textContent=g?fmt(g.temp_c,0):'—';
  $('tempSub').textContent=g?g.name:T().unavailable;
  $('tempSource').textContent=g?T().measured:T().unavailable;
  $('power').textContent=g?fmt(g.power_w,0):'—';
  $('powerSub').textContent=g?(has(g.power_limit_w)?('上限 '+fmt(g.power_limit_w,0)+' W'):T().powerGpu): T().unavailable;
  $('powerSource').textContent=g?T().measured:T().unavailable;
  $('pcie').textContent=g&&has(g.pcie_gen)?('Gen'+fmt(g.pcie_gen,0)):'—';
  $('pcieUnit').textContent=g&&has(g.pcie_width)?('x'+fmt(g.pcie_width,0)):'';
  $('pcieSub').textContent=g?(has(g.pcie_gen)?T().pcieLink:T().pcieUnavailable):T().pcieUnavailable;
  $('pcieSource').textContent=g&&has(g.pcie_gen)?T().measured:T().unavailable;
  push('gpu', g?g.util_percent:null); push('vram', g?g.mem_used_mb/1024:null); push('temp', g?g.temp_c:null); push('power', g?g.power_w:null);
  $('gpuLoadSpark').innerHTML=spark(H.gpu,'#10b981');
  $('vramSpark').innerHTML=spark(H.vram,'#10b981');
  $('tempSpark').innerHTML=spark(H.temp,'#f59e0b');
  $('powerSpark').innerHTML=spark(H.power,'#10b981');
  $('pcieSpark').innerHTML=spark([null],'#38bdf8');
  // CPU 卡
  const cpu=s.host_cpu||{};
  $('cpu').textContent=(cpu.available&&has(cpu.util_percent))?fmt(cpu.util_percent,1):'—';
  $('cpuSub').textContent=cpu.available?(cpu.model?cpu.model+ (cpu.cores?' · '+cpu.cores+' 核':''):T().hostCpu):T().unavailable+'：'+(cpu.reason||T().unknown);
  $('cpuSource').textContent=cpu.available?T().measured:T().unavailable;
  push('cpu', cpu.available?cpu.util_percent:null);
  $('cpuSpark').innerHTML=spark(H.cpu,'#10b981');
  // 磁盘读取卡
  const disk=s.host_disk||{};
  const readMbs=disk.available?disk.read_mbs:null, writeMbs=disk.available?disk.write_mbs:null;
  $('disk').textContent=has(readMbs)?(readMbs>=1024?fmt(readMbs/1024,2):fmt(readMbs,1)):'—';
  $('diskUnit').textContent=has(readMbs)?(readMbs>=1024?'GB/s':'MB/s'):'';
  $('diskSub').textContent=has(writeMbs)?((writeMbs>=1024?T().diskWriteGb.replace('{x}', fmt(writeMbs/1024,2)):T().diskWrite.replace('{x}', fmt(writeMbs,1)))):(disk.available?T().diskReadSub:T().unavailable+'：'+(disk.reason||T().unknown));
  $('diskSource').textContent=disk.available?T().measured:T().unavailable;
  push('disk', readMbs);
  $('diskSpark').innerHTML=spark(H.disk,'#38bdf8');
  const outTok = s.counters ? s.counters.decode_tokens : null;
  $('outTokens').textContent = has(outTok) ? fmtTok(outTok) : '—';
  $('outTokensSub').textContent = has(outTok) ? T().outTokensSub : T().unavailable;
  $('outTokensSource').textContent = has(outTok) ? T().measured : T().unavailable;
  push('out', has(outTok) ? outTok : null);
  $('outTokensSpark').innerHTML = spark(H.out, '#10b981');
  // 上下文占用表
  const pct = ctx.max_prompt_share_percent;
  $('gaugePct').textContent=fmtPct1(pct);
  $('gaugeSub').textContent=ctx.max_processing_prompt_tokens?(T().gaugeLongest.replace('{a}', fmtTok(ctx.max_processing_prompt_tokens)).replace('{b}', fmtTok(ctx.max_context))):T().gaugeNoReq;
  $('gaugeArc').setAttribute('stroke-dasharray', (has(pct)?(235.6*pct/100).toFixed(1):0)+' 314.2');
  $('kvBarText').textContent=has(ctx.kv_used_percent)?(fmtTok(ctx.kv_tokens)+' / '+fmtTok(ctx.kv_capacity_tokens)):'—';
  $('kvBar').style.width=has(ctx.kv_used_percent)?Math.min(100,ctx.kv_used_percent)+'%':'0%';
  const hm=s.host_memory||{};
  $('ramBarText').textContent=hm.available?(fmtBytes(hm.used_mb*1048576)+' / '+fmtBytes(hm.total_mb*1048576)):'—';
  $('ramBar').style.width=hm.available&&has(hm.used_percent)?Math.min(100,hm.used_percent)+'%':'0%';
  $('tempBarText').textContent=g?fmt(g.temp_c,0)+' °C':'—';
  $('tempBar').style.width=g&&has(g.temp_c)?Math.min(100,g.temp_c/90*100)+'%':'0%';
  // 当前请求表（含过去 1 小时观测记录）由 renderReqTable 画：当前行来自
  // 快照，过去行来自 /api/request-history。slots 仍留给对话缓存与合计行用。
  const slots=s.slots||{};
  _lastSnap = s;
  renderReqTable(s);
  // 对话缓存
  $('parkedText').textContent=(slots.retained??'—')+' / '+(slots.total??'—');
  $('parkedBar').style.width=(slots.total)?(slots.retained/slots.total*100)+'%':'0%';
  const hkv=ctx.host_kv_bytes, hkvCap=ctx.host_kv_capacity_bytes;
  $('cacheMemText').textContent=(hkv&&hkvCap)?(fmtBytes(hkv)+' / '+fmtBytes(hkvCap)):'—';
  $('cacheMemBar').style.width=(hkv&&hkvCap)?Math.min(100,hkv/hkvCap*100)+'%':'0%';
  $('lastCacheText').textContent=(s.counters&&s.counters.reused_prompt_tokens)?(T().lastCacheReuse.replace('{x}', fmtTok(s.counters.reused_prompt_tokens))):T().reuseNotReported;
  $('reusedTotalText').textContent=(s.counters&&s.counters.reused_prompt_tokens)?fmtTok(s.counters.reused_prompt_tokens):'—';
  // Context-cache pressure / reuse paths / transfers (from /stats; only
  // present on builds that report context_cache). Each line appears only
  // when its numbers were actually reported.
  const ce = s.cache_extra || {};
  const ceLines = [];
  {
    const parts = [];
    if(ce.evicted !== null && ce.evicted !== undefined) parts.push(T().evictLabel + ' ' + fmtTok(ce.evicted));
    if(ce.demoted !== null && ce.demoted !== undefined) parts.push(T().demoteLabel + ' ' + fmtTok(ce.demoted));
    if(ce.spill_pages !== null && ce.spill_pages !== undefined) parts.push(T().spillLabel + ' ' + fmtTok(ce.spill_pages));
    if(ce.checkpoints_dropped !== null && ce.checkpoints_dropped !== undefined) parts.push(T().ckptLabel + ' ' + fmtTok(ce.checkpoints_dropped));
    if(parts.length) ceLines.push(T().pressureLabel + '：' + parts.join(' · '));
  }
  if(ce.selections){
    const ents = Object.entries(ce.selections).map(([k, v]) => k.replace(/_/g, ' ') + ' ' + fmtTok(v));
    if(ents.length) ceLines.push(T().reusePathsLabel + '：' + ents.join(' · '));
  }
  {
    const parts = [];
    if(ce.transfer_d2h_bytes !== null && ce.transfer_d2h_bytes !== undefined) parts.push(T().d2hLabel + ' ' + fmtBytes(ce.transfer_d2h_bytes));
    if(ce.transfer_h2d_bytes !== null && ce.transfer_h2d_bytes !== undefined) parts.push(T().h2dLabel + ' ' + fmtBytes(ce.transfer_h2d_bytes));
    if(parts.length) ceLines.push(T().transfersLabel + '：' + parts.join(' · '));
  }
  const ceEl = $('cacheExtra');
  ceEl.replaceChildren(...ceLines.map(l => { const dv = document.createElement('div'); dv.textContent = l; return dv; }));
  ceEl.style.display = ceLines.length ? '' : 'none';
  if(m.requests_total!==undefined && m.requests_total!==null){
    $('requestTotals').textContent=T().requestTotals.replace('{total}', m.requests_total).replace('{d}', fmtRateNum(m.avg_decode_tok_s)).replace('{p}', fmtRateRaw(m.avg_prefill_tok_s)).replace('{r}', (s.counters?.reused_prompt_tokens?fmtTok(s.counters.reused_prompt_tokens):'—')).replace('{cur}', (slots.processing||0)).replace('{q}', (r.waiting||0)) + (_pastEndedCount !== null ? T().reqPastEnded.replace('{n}', _pastEndedCount) : '')
      + (m.requests_failed_total > 0 ? T().reqFailedPart.replace('{n}', m.requests_failed_total) : '')
      + (m.requests_rejected_total > 0 ? T().reqRejectedPart.replace('{n}', m.requests_rejected_total) : '');
  }
  fetchHistory().then(drawHistory);
  if(_prevOnline === true && !s.ninfer_ok){
    const chk = $('notifyOfflineChk');
    if(chk && chk.checked && 'Notification' in window && Notification.permission === 'granted'){
      try{ new Notification(T().notifyOfflineTitle, {body: T().notifyOfflineBody}); }catch(e){}
    }
  }
  _prevOnline = !!s.ninfer_ok;
}
let _updateData = null;

  const b = $('updateBanner');
  if(_updateData && _updateData.update_available && _updateData.url){
    b.style.display = 'block';
    b.innerHTML = '';
    b.appendChild(document.createTextNode(T().updateAvailable.replace('{v}', _updateData.latest) + ' '));
    const a = document.createElement('a');
    a.href = _updateData.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = T().viewRelease; b.appendChild(a);
  } else {
    b.style.display = 'none';
  }
}

    $('versionText').textContent = T().versionLabel + ' v' + v.version +
      (v.update_check_enabled ? '' : T().updateCheckOff);

// Display refresh interval only (backend sampling stays at its own POLL).
// Stored in localStorage; the backend history point density is unaffected.
let pollMs = (() => {
  try{
    const v = parseInt(localStorage.getItem('ninfer-panel-poll-ms'), 10);
    if(v >= 1000 && v <= 10000) return v;
  }catch(e){}
  return 2000;
})();
let pollTimer = null;
function restartPoll(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => { tick(); fetchEvents(); fetchReqHistory(); }, pollMs);
}
$('pollIntervalInput').value = pollMs / 1000;
$('pollIntervalInput').addEventListener('change', () => {
  let sec = parseInt($('pollIntervalInput').value, 10);
  if(!isFinite(sec)) sec = 2;
  sec = Math.max(1, Math.min(10, sec));
  $('pollIntervalInput').value = sec;
  pollMs = sec * 1000;
  try{ localStorage.setItem('ninfer-panel-poll-ms', String(pollMs)); }catch(e){}
  restartPoll();
});
// History export: CSV from the samples already fetched for this window.
$('exportHistBtn').addEventListener('click', () => {
  const lastT = histSamples.length ? histSamples[histSamples.length - 1].t : Date.now() / 1000;
  const t1 = Math.max(Date.now() / 1000, lastT);
  const t0 = t1 - histMinutes * 60;
  const COL = {decode:'decode_tok_s', prefill:'prefill_tok_s', kv:'kv_pct', gpu:'gpu_pct', cum:'cum_decode_tokens', accept:'spec_accept_pct'};
  const FIELD = {decode:'decode', prefill:'prefill', kv:'kv', gpu:'gpu', cum:'out', accept:'accept'};
  const header = ['time', ...histDims.map(d => COL[d])].join(',');
  const lines = [header];
  histSamples.filter(p => p.t >= t0).forEach(p => {
    lines.push([new Date(p.t * 1000).toISOString(), ...histDims.map(d => { const v = p[FIELD[d]]; return (v === null || v === undefined) ? '' : v; })].join(','));
  });
  const blob = new Blob([lines.join('\n')], {type: 'text/csv'});
  const a = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g, '').slice(0, 15);
  a.href = URL.createObjectURL(blob);
  a.download = `ninfer-history-${histMinutes}min-${stamp}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
});
// State events: throttled to at most one fetch per 10 s; missing data
// never breaks the main panel.
let _lastEventsFetch = 0, _eventsCache = [];
function stateLabel(s){
  return {idle:T().badgeIdle, warming:T().badgeReading, generating:T().badgeGenerating,
    queued:T().badgeQueued, offline:T().badgeError}[s] || s;
}
function renderEvents(){
  const ul = $('eventList'), empty = $('eventsEmpty');
  ul.innerHTML = '';
  const recent = [..._eventsCache].reverse().slice(0, 20);
  empty.style.display = recent.length ? 'none' : 'block';
  recent.forEach(e => {
    const li = document.createElement('li');
    li.textContent = new Date(e.t * 1000).toLocaleString() + ' ' +
      stateLabel(e.from) + ' → ' + stateLabel(e.to) + (e.error ? ' · ' + e.error : '');
    ul.appendChild(li);
  });
}
async function fetchEvents(){
  const now = Date.now();
  if(now - _lastEventsFetch < 10000 && _eventsCache.length) return;
  _lastEventsFetch = now;
  try{
    const j = await (await fetch('/api/events')).json();
    _eventsCache = j.events || [];
    renderEvents();
  }catch(e){ /* events missing never breaks the main panel */ }
}
// Spark seeding: on load, seed the page-local spark buffers from the
// persisted backend history (last 30 points of a 5-minute window), then
// live ticks keep appending. A refresh therefore no longer wipes any
// card sparkline. PCIe has no numeric series (link info only), so its
// sparkline stays a dashed baseline.
async function seedSparks(){
  try{
    const j = await (await fetch('/api/history?minutes=5')).json();
    const s = (j.samples || []).slice(-30);
    if(s.length){
      H.decode = s.map(p => p.decode);
      H.prefill = s.map(p => p.prefill);
      H.gpu = s.map(p => p.gpu);
      H.vram = s.map(p => p.vram);
      H.temp = s.map(p => p.temp);
      H.power = s.map(p => p.power);
      H.cpu = s.map(p => p.cpu);
      H.disk = s.map(p => p.disk);
      H.out = s.map(p => p.out);
    }
  }catch(e){ /* seeding is best-effort; live ticks fill the sparklines anyway */ }
}
seedSparks().finally(() => { tick(); fetchEvents(); fetchReqHistory(); restartPoll(); });
</script>
<script>
// ---- ninfer-console v0.1（管理视图，只读预览）----
// 数据全部来自 /api/console*；本段代码不调用任何会改变 NInfer 或
// Docker 状态的接口。表单与后端的唯一事实源都是 console_core 的
// PARAM_SCHEMA：字段、顺序、范围不在前端另抄一份。
const MG = {data: null, preview: null, draftTimer: null, router: null};
let mgRouterTimer = null;
const mgT = () => T();
const mgLang = () => (LANG === 'en' ? 'en' : 'zh');
const mgNote = obj => obj.note || '';
const mgLabel = obj => obj.label || obj.id || '';
const mgMsg = issue => (mgLang() === 'en' ? issue.message_en : issue.message_zh);
const mgFieldLabel = key => mgT()['mgF_' + key] || key;
const mgModelById = id => (MG.data ? MG.data.models.find(m => m.id === id) : null);

function switchView(name){
  const manage = name === 'manage';
  // 页头（标题 + 视图切换 + 设置）与设置弹窗在两个视图里都要在：
  // 只藏监控栈的内容区，页头藏了用户就回不来了。
  document.querySelectorAll('.monitor-dashboard > *').forEach(ch => {
    if(ch.classList.contains('page-head') || ch.classList.contains('modal')) return;
    ch.style.display = manage ? 'none' : '';
  });
  $('manageView').style.display = manage ? '' : 'none';
  $('viewMonitorBtn').dataset.active = manage ? 'false' : 'true';
  $('viewManageBtn').dataset.active = manage ? 'true' : 'false';
  try{ localStorage.setItem('ninfer-panel-view', name); }catch(e){}
  if(manage && !MG.data) loadConsole();
  if(mgRouterTimer){ clearInterval(mgRouterTimer); mgRouterTimer = null; }
  if(manage){
    refreshRouter();
    loadPresetFile();
    mgRouterTimer = setInterval(refreshRouter, 5000);
  }
}
$('viewMonitorBtn').addEventListener('click', () => switchView('monitor'));
$('viewManageBtn').addEventListener('click', () => switchView('manage'));

async function loadConsole(){
  try{
    MG.data = await (await fetch('/api/console')).json();
    MG.router = MG.data.router || null;
    const start = MG.data.draft || MG.data.current.config;
    if(MG.data.draft) $('mgDraftNote').style.display = '';
    renderConsoleAll(JSON.parse(JSON.stringify(start)));
  }catch(e){ /* 管理面加载失败不影响监控面 */ }
}

function renderConsoleAll(cfg){
  renderProblems(); renderRunCard(); renderModels(); renderPresets(); buildForm(cfg); renderHistory();
  paintRouter();
  refreshPreview();
}

function renderProblems(){
  const box = $('mgProblems');
  const probs = (MG.data && MG.data.registry_problems) || [];
  box.style.display = probs.length ? '' : 'none';
  box.textContent = probs.length ? mgT().mgProblemsTitle + ' ' + probs.join('；') : '';
}

$('mgImportBtn').addEventListener('click', () => $('mgImportFile').click());
$('mgPresetFileReload').addEventListener('click', () => { MG_PRESET_SAVED = null; loadPresetFile(); });
$('mgPresetFileSave').addEventListener('click', savePresetFile);
$('mgPresetFileText').addEventListener('input', () => {
  $('mgPresetFileSave').disabled = $('mgPresetFileText').value === MG_PRESET_SAVED;
});
$('mgImportFile').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if(!file) return;
  const msg = $('mgBundleMsg');
  const show = (text) => { msg.style.display = ''; msg.textContent = text; };
  let bundle;
  try{ bundle = JSON.parse(await file.text()); }
  catch(e){ show(mgT().mgBundleBad + ': ' + mgT().mgBundleReadErr); return; }
  try{
    const res = await fetch('/api/console/import-bundle', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(bundle)});
    const out = await res.json();
    if(!res.ok){
      show(mgT().mgBundleBad + ': ' + ((out.problems || []).join('; ') || res.status));
      return;
    }
    const parts = [mgT().mgBundleOk];
    if(out.applied.models !== null && out.applied.models !== undefined)
      parts.push(mgT().mgBundleModels + ' ' + out.applied.models);
    if(out.applied.presets !== null && out.applied.presets !== undefined)
      parts.push(mgT().mgBundlePresets + ' ' + out.applied.presets);
    if(out.applied.current) parts.push(mgT().mgBundleCurrent);
    if((out.problems || []).length)
      parts.push(mgT().mgBundleProblems + ' ' + out.problems.length + ': ' + out.problems.join('; '));
    show(parts.join(' · '));
    MG.data = null;
    loadConsole();
  }catch(e){ show(mgT().mgBundleBad + ': ' + e); }
});

$('mgSaveCurrentBtn').addEventListener('click', async () => {
  const cfg = collectForm();
  try{
    const resp = await fetch('/api/console/current', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({config: cfg})});
    if(!resp.ok) return;
    MG.data = await (await fetch('/api/console')).json();
    renderConsoleAll(JSON.parse(JSON.stringify(cfg)));
  }catch(e){ /* 保存失败保持现状，校验区会继续显示问题 */ }
});

function renderRunCard(){
  const d = MG.data, cur = d.current.config;
  const m = mgModelById(cur.model);
  $('mgRunModel').textContent = m ? m.name : (cur.model || '—');
  $('mgRunImage').textContent = cur.image || '—';
  $('mgRunInflight').textContent = (d.live && d.live.in_flight !== null && d.live.in_flight !== undefined) ? d.live.in_flight : '—';
  $('mgRunSource').textContent = mgT()['mgSrc_' + (d.current.source || '')] || d.current.source || '—';
  const st = $('mgRunState');
  st.textContent = d.live && d.live.ninfer_ok ? stateLabel(d.live.state || 'idle') : mgT().badgeError;
  st.className = 'mg-badge ' + (d.live && d.live.ninfer_ok ? 'on' : 'danger');
  const chk = $('mgLiveCheck');
  if(!d.live || !d.live.ninfer_ok){
    chk.textContent = mgT().mgLiveUnknown;
  } else {
    const bad = (d.live.checks || []).filter(c => c.match === false).map(c => mgFieldLabel(c.key));
    if(d.live.model_match === false) bad.push(mgFieldLabel('model'));
    chk.textContent = bad.length ? mgT().mgLiveMismatch.replace('{x}', bad.join(', ')) : mgT().mgLiveOk;
    chk.style.color = bad.length ? 'var(--st-warn-text)' : '';
  }
}

function renderModels(){
  const d = MG.data;
  $('mgModelsNote').textContent = d.models_dir.configured ? mgT().mgModelsDirMounted : mgT().mgModelsDirNotMounted;
  const wrap = $('mgModelList');
  wrap.innerHTML = '';
  d.models.forEach(m => {
    const row = document.createElement('div');
    row.className = 'mg-model-row';
    if(m.id && MG._formModel === m.id && !m.is_current){
      row.style.background = 'var(--st-info-tint)';
      row.style.borderRadius = '12px';
      row.style.paddingLeft = '12px'; row.style.paddingRight = '12px';
    }
    const left = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'mg-model-name'; nm.textContent = m.name;
    const meta = document.createElement('div'); meta.className = 'mg-model-meta num';
    const size = (m.size_gb !== null && m.size_gb !== undefined) ? (Math.round(m.size_gb * 100) / 100) + ' GB' : '—';
    const bits = [size];
    if(m.source === 'discovered') bits.push(mgT().mgDiscovered);
    if(mgNote(m)) bits.push(mgNote(m));
    meta.textContent = bits.join(' · ');
    left.append(nm, meta); row.appendChild(left);
    const comps = [['vision','Vision'], ['dflash2','DFlash2'], ['mtp','MTP']];
    comps.forEach(([k, label]) => {
      if(m.components && m.components[k]){
        const b = document.createElement('span'); b.className = 'mg-badge info'; b.textContent = label; row.appendChild(b);
      }
    });
    const sp = document.createElement('span'); sp.className = 'spacer'; row.appendChild(sp);
    if(m.id){
      const rc = document.createElement('span');
      rc.className = 'mg-router-cell'; rc.dataset.routerFor = m.id;
      if(m.file) rc.dataset.routerStem = m.file.replace(/\.ninfer$/, '');
      row.appendChild(rc);
    }
    if(m.is_current){
      const b = document.createElement('span'); b.className = 'mg-badge on'; b.textContent = mgT().mgCurrentBadge; row.appendChild(b);
    } else if(m.present === false){
      const b = document.createElement('span'); b.className = 'mg-badge danger'; b.textContent = mgT().mgAbsentBadge; row.appendChild(b);
    } else if(m.id){
      const btn = document.createElement('button');
      btn.className = 'mg-btn'; btn.type = 'button'; btn.textContent = mgT().mgSelect;
      btn.addEventListener('click', () => {
        const cfg = collectForm(); cfg.model = m.id; normalizeLinkages(cfg, 'model');
        setFormValues(cfg); onFormEdited();
      });
      row.appendChild(btn);
    }
    wrap.appendChild(row);
  });
}

function routerStateFor(id, stem){
  const models = (MG.router && MG.router.models) || [];
  return models.find(x => x.id === id) || (stem ? models.find(x => x.id === stem) : null) || null;
}

function paintRouter(){
  const note = $('mgRouterNote');
  if(!MG.router) note.textContent = '';
  else if(!MG.router.available)
    note.textContent = MG.router.reason === 'not_router' ? mgT().mgRouterOff : mgT().mgRouterUnknown;
  else note.textContent = mgT().mgRouterOn;
  // Engine catalog entries with no console row get a minimal row of
  // their own, so every switchable model is reachable.
  const extra = $('mgRouterExtra');
  extra.innerHTML = '';
  if(MG.router && MG.router.available){
    const known = new Set();
    document.querySelectorAll('[data-router-for]').forEach(c => {
      known.add(c.dataset.routerFor);
      if(c.dataset.routerStem) known.add(c.dataset.routerStem);
    });
    MG.router.models.filter(x => !known.has(x.id)).forEach(x => {
      const row = document.createElement('div'); row.className = 'mg-model-row';
      const nm = document.createElement('div'); nm.className = 'mg-model-name'; nm.textContent = x.id;
      const cell = document.createElement('span');
      cell.className = 'mg-router-cell'; cell.dataset.routerFor = x.id;
      row.append(nm, cell); extra.appendChild(row);
    });
  }
  document.querySelectorAll('[data-router-for]').forEach(cell => {
    cell.innerHTML = '';
    if(!MG.router || !MG.router.available) return;
    const st = routerStateFor(cell.dataset.routerFor, cell.dataset.routerStem);
    if(!st) return;
    const badge = document.createElement('span');
    badge.className = 'mg-badge' + (st.status === 'loaded' ? ' on' : st.status === 'sleeping' ? ' info' : '');
    badge.textContent = mgT()['mgState_' + st.status] || mgT().mgState_unknown;
    cell.appendChild(badge);
    // Deliberately one action only: switch to this model. Loading it
    // makes the engine displace whatever is serving now; there are no
    // standalone sleep / wake / unload controls, and nothing switches
    // on its own — every switch is a manual click here.
    if(st.status === 'sleeping' || st.status === 'unloaded'){
      const b = document.createElement('button');
      b.className = 'mg-btn'; b.type = 'button';
      b.textContent = mgT().mgActSwitch;
      b.addEventListener('click', () => modelAction(st.id, 'load'));
      cell.appendChild(b);
    }
  });
}

let MG_PRESET_SAVED = null;
async function loadPresetFile(){
  const state = document.getElementById('mgPresetFileState');
  const hint = document.getElementById('mgPresetFileHint');
  const text = document.getElementById('mgPresetFileText');
  const btns = document.getElementById('mgPresetFileBtns');
  const msg = document.getElementById('mgPresetFileMsg');
  let r;
  try{ r = await (await fetch('/api/console/preset-file')).json(); }
  catch(e){ hint.textContent = mgT().mgPresetUnreadable; return; }
  if(!r.available){
    text.hidden = true; btns.hidden = true; state.textContent = '';
    hint.textContent = r.reason === 'not_configured'
      ? mgT().mgPresetNotConfigured : mgT().mgPresetUnreadable;
    return;
  }
  hint.textContent = mgT().mgPresetHint;
  text.hidden = false; btns.hidden = false;
  if(document.activeElement !== text || MG_PRESET_SAVED === null){
    text.value = r.content; MG_PRESET_SAVED = r.content;
  }
  const v = r.validation || {};
  state.textContent = (v.sections || []).map(s => s.name).join(' · ');
  if(!r.writable) msg.textContent = mgT().mgPresetNotWritable;
  document.getElementById('mgPresetFileSave').disabled =
    text.value === MG_PRESET_SAVED || !r.writable;
}
async function savePresetFile(){
  const text = document.getElementById('mgPresetFileText');
  const msg = document.getElementById('mgPresetFileMsg');
  try{
    const resp = await fetch('/api/console/preset-file', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({content: text.value})});
    const r = await resp.json();
    if(!r.ok){
      const errs = (r.validation && r.validation.errors || [r.error || '']).join('; ');
      msg.textContent = mgT().mgPresetInvalid + errs;
      return;
    }
    MG_PRESET_SAVED = text.value;
    document.getElementById('mgPresetFileSave').disabled = true;
    let note = mgT().mgPresetSaved + mgT().mgPresetRestartNote;
    if(r.validation && r.validation.unknown_sections && r.validation.unknown_sections.length)
      note += ' ' + mgT().mgPresetUnknownSections + r.validation.unknown_sections.join(', ');
    msg.textContent = note;
  }catch(e){
    msg.textContent = mgT().mgPresetInvalid + String(e);
  }
}

async function refreshRouter(){
  try{
    MG.router = await (await fetch('/api/console/router')).json();
    if(MG.data) paintRouter();
  }catch(e){ /* 面板本地接口抖动不打扰用户，下个周期再刷 */ }
}

async function modelAction(id, action){
  try{
    const res = await fetch('/api/console/model-action', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model: id, action})});
    const out = await res.json();
    if(!res.ok || !out.ok){
      const why = out.error || (out.engine && out.engine.error) ||
                  ('HTTP ' + (out.engine_status || res.status));
      alert(mgT().mgActFailed + ': ' + why);
    }
  }catch(e){ alert(mgT().mgActFailed + ': ' + e); }
  let n = 0;
  const iv = setInterval(async () => {
    n++;
    await refreshRouter();
    const st = MG.router && MG.router.models.find(x => x.id === id);
    if((st && st.status !== 'loading') || n > 40) clearInterval(iv);
  }, 1500);
}

function renderPresets(){
  const sel = $('mgPresetSel');
  sel.innerHTML = '';
  const ph = document.createElement('option'); ph.value = ''; ph.textContent = mgT().mgPresetPlaceholder; sel.appendChild(ph);
  MG.data.presets.forEach(p => {
    const o = document.createElement('option'); o.value = p.id; o.textContent = mgLabel(p); sel.appendChild(o);
  });
}
$('mgPresetLoad').addEventListener('click', () => {
  const id = $('mgPresetSel').value;
  if(!id) return;
  const p = MG.data.presets.find(x => x.id === id);
  if(!p) return;
  const cfg = JSON.parse(JSON.stringify(p.config));
  buildForm(cfg); onFormEdited();
});

const MG_GROUPS = ['basic', 'context', 'sched', 'spec', 'advanced'];
function buildForm(cfg){
  const form = $('mgForm');
  form.innerHTML = '';
  MG_GROUPS.forEach(g => {
    const fields = MG.data.schema.filter(f => f.group === g);
    if(!fields.length) return;
    const sec = document.createElement('div'); sec.className = 'mg-group';
    const h = document.createElement('h3'); h.textContent = mgT()['mgG_' + g] || g; sec.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'mg-grid';
    fields.forEach(f => grid.appendChild(buildField(f)));
    sec.appendChild(grid); form.appendChild(sec);
  });
  setFormValues(cfg);
}
function buildField(f){
  const wrap = document.createElement('div');
  wrap.className = 'mg-field'; wrap.dataset.key = f.key;
  if(f.kind !== 'bool'){
    const lab = document.createElement('label'); lab.textContent = mgFieldLabel(f.key); wrap.appendChild(lab);
  }
  let ctl = null;
  if(f.kind === 'bool'){
    const box = document.createElement('div'); box.className = 'chk';
    ctl = document.createElement('input'); ctl.type = 'checkbox'; ctl.dataset.key = f.key;
    const span = document.createElement('span'); span.textContent = mgFieldLabel(f.key);
    box.append(ctl, span); wrap.appendChild(box);
  } else if(f.kind === 'model'){
    ctl = document.createElement('select'); ctl.className = 'ctl'; ctl.dataset.key = f.key;
    MG.data.models.filter(m => m.id).forEach(m => {
      const o = document.createElement('option'); o.value = m.id; o.textContent = m.name; ctl.appendChild(o);
    });
    wrap.appendChild(ctl);
  } else if(f.kind === 'enum'){
    ctl = document.createElement('select'); ctl.className = 'ctl'; ctl.dataset.key = f.key;
    if(f.nullable){ const o = document.createElement('option'); o.value = ''; o.textContent = '—'; ctl.appendChild(o); }
    (f.choices || []).forEach(c => {
      const o = document.createElement('option'); o.value = c; o.textContent = mgT()['mgEnum_' + f.key + '_' + c] || c; ctl.appendChild(o);
    });
    wrap.appendChild(ctl);
  } else if(f.kind === 'int_or_auto'){
    ctl = document.createElement('input'); ctl.className = 'ctl'; ctl.dataset.key = f.key;
    ctl.type = 'text'; ctl.inputMode = 'numeric'; wrap.appendChild(ctl);
  } else if(f.kind === 'int'){
    ctl = document.createElement('input'); ctl.className = 'ctl'; ctl.dataset.key = f.key;
    ctl.type = 'number'; if(f.min !== undefined) ctl.min = f.min; if(f.max !== undefined) ctl.max = f.max;
    wrap.appendChild(ctl);
  } else {
    ctl = document.createElement('input'); ctl.className = 'ctl'; ctl.dataset.key = f.key;
    ctl.type = 'text'; wrap.appendChild(ctl);
  }
  const hint = document.createElement('div'); hint.className = 'hint'; hint.dataset.hint = f.key; wrap.appendChild(hint);
  if(ctl){
    ctl.addEventListener('change', () => onFormEdited(f.key));
    ctl.addEventListener('input', () => onFormEdited(f.key, true));
  }
  return wrap;
}
function mgCtl(key){ return document.querySelector('#mgForm select[data-key="' + key + '"], #mgForm input[data-key="' + key + '"]'); }
function setFormValues(cfg){
  MG._formModel = cfg.model;
  MG.data.schema.forEach(f => {
    const ctl = mgCtl(f.key);
    if(!ctl) return;
    const v = cfg[f.key];
    if(f.kind === 'bool') ctl.checked = !!v;
    else if(f.kind === 'int' || f.kind === 'int_or_auto') ctl.value = (v === null || v === undefined) ? '' : v;
    else ctl.value = (v === null || v === undefined) ? '' : v;
  });
  applyFieldStates(cfg); markChanged(cfg);
}
function collectForm(){
  const cfg = {};
  MG.data.schema.forEach(f => {
    const ctl = mgCtl(f.key);
    if(!ctl){ cfg[f.key] = null; return; }
    if(f.kind === 'bool') cfg[f.key] = ctl.checked;
    else if(f.kind === 'int'){
      const raw = ctl.value.trim();
      cfg[f.key] = raw === '' ? null : (Number.isFinite(parseInt(raw, 10)) ? parseInt(raw, 10) : raw);
    } else if(f.kind === 'int_or_auto'){
      const raw = ctl.value.trim();
      cfg[f.key] = raw === '' ? null : (raw === 'auto' ? 'auto' : (Number.isFinite(parseInt(raw, 10)) ? parseInt(raw, 10) : raw));
    } else if(f.kind === 'enum' || f.kind === 'model' || f.kind === 'image'){
      cfg[f.key] = ctl.value === '' ? null : ctl.value;
    } else {
      const raw = ctl.value.trim();
      cfg[f.key] = raw === '' ? null : raw;
    }
  });
  return cfg;
}
function normalizeLinkages(cfg, changedKey){
  const m = mgModelById(cfg.model);
  if(m){
    if(cfg.spec && cfg.spec !== 'none' && !(m.specs || []).includes(cfg.spec)) cfg.spec = m.default_spec || 'none';
    if(cfg.vision && m.components && m.components.vision === false) cfg.vision = false;
  }
  if(cfg.spec !== 'dflash2') cfg.draft_tokens = null;
  if(cfg.cache_mode === 'hybrid') cfg.host_kv_mib = null;
  if(cfg.cache_mode === 'catalog') cfg.host_cache_mib = null;
  if(!cfg.vision) cfg.vision_residency = null;
  return cfg;
}
function applyFieldStates(cfg){
  const dis = (key, off) => {
    const ctl = mgCtl(key); if(!ctl) return;
    ctl.disabled = off;
    const wrap = ctl.closest('.mg-field'); if(wrap) wrap.classList.toggle('disabled', off);
  };
  dis('draft_tokens', cfg.spec !== 'dflash2');
  dis('host_cache_mib', cfg.cache_mode !== 'hybrid');
  dis('host_kv_mib', cfg.cache_mode !== 'catalog');
  dis('vision_residency', !cfg.vision);
}
function mgDisplayVal(key, v){
  if(v === null || v === undefined) return mgT().mgRemoved;
  if(key === 'model'){ const m = mgModelById(v); return m ? m.name : v; }
  if(typeof v === 'boolean') return v ? '✓' : '—';
  return String(v);
}
function markChanged(cfg){
  const cur = MG.data.current.config;
  MG.data.schema.forEach(f => {
    const wrap = document.querySelector('#mgForm .mg-field[data-key="' + f.key + '"]');
    if(!wrap) return;
    const changed = cfg[f.key] !== cur[f.key];
    wrap.classList.toggle('changed', changed);
    const hint = wrap.querySelector('[data-hint]');
    if(hint) hint.textContent = changed ? mgT().mgOriginal.replace('{x}', mgDisplayVal(f.key, cur[f.key])) : '';
  });
}
function onFormEdited(changedKey, soft){
  let cfg = collectForm();
  if(changedKey) cfg = normalizeLinkages(cfg, changedKey);
  setFormValues(cfg);
  renderModels();
  refreshPreview();
  if(!soft) scheduleDraftSave(cfg);
  else scheduleDraftSave(cfg);
}
function scheduleDraftSave(cfg){
  if(MG.draftTimer) clearTimeout(MG.draftTimer);
  MG.draftTimer = setTimeout(async () => {
    const cur = MG.data.current.config;
    const same = MG.data.schema.every(f => cfg[f.key] === cur[f.key]);
    try{
      await fetch('/api/console/draft', {method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({config: same ? null : cfg})});
      $('mgDraftNote').style.display = same ? 'none' : '';
    }catch(e){ /* 草稿保存失败不影响预览 */ }
  }, 800);
}
$('mgDraftClear').addEventListener('click', async () => {
  try{ await fetch('/api/console/draft', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({config: null})}); }catch(e){}
  $('mgDraftNote').style.display = 'none';
  buildForm(JSON.parse(JSON.stringify(MG.data.current.config)));
  refreshPreview();
});
async function refreshPreview(){
  if(!MG.data) return;
  const cfg = collectForm();
  try{
    const resp = await fetch('/api/console/preview', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({config: cfg})});
    MG.preview = await resp.json();
  }catch(e){ return; }
  const box = $('mgIssues');
  box.innerHTML = '';
  const p = MG.preview;
  (p.errors || []).forEach(i => { const dv = document.createElement('div'); dv.className = 'err'; dv.textContent = '✕ ' + mgMsg(i); box.appendChild(dv); });
  (p.warnings || []).forEach(i => { const dv = document.createElement('div'); dv.className = 'wrn'; dv.textContent = '⚠ ' + mgMsg(i); box.appendChild(dv); });
  if(!(p.errors || []).length){
    const dv = document.createElement('div'); dv.className = 'ok'; dv.textContent = '✓ ' + mgT().mgValidOk; box.appendChild(dv);
  }
  const n = (p.diff || []).length;
  const badge = $('mgChangeCount');
  badge.style.display = n ? '' : 'none';
  badge.textContent = mgT().mgChangesCount.replace('{n}', n);
  $('mgPreviewBtn').disabled = !(p.ok && n);
  $('mgSaveCurrentBtn').disabled = !p.ok;
  if($('mgDiffModal').classList.contains('open')) renderDiff();
}
function renderHistory(){
  const tb = $('mgHistoryBody');
  tb.innerHTML = '';
  MG.data.history.forEach((h, idx) => {
    const cfg = h.config;
    const tr = document.createElement('tr');
    const cells = [
      h.t_label,
      mgDisplayVal('model', cfg.model),
      mgDisplayVal('image', cfg.image),
      cfg.cache_mode + ' · ' + mgFieldLabel('max_concurrency') + ' ' + cfg.max_concurrency + ' · ' + cfg.spec + (cfg.draft_tokens ? '×' + cfg.draft_tokens : ''),
      mgLang() === 'en' ? h.source_en : h.source_zh,
    ];
    cells.forEach(c => { const td = document.createElement('td'); td.textContent = c; tr.appendChild(td); });
    const td = document.createElement('td');
    if(h.current){
      const b = document.createElement('span'); b.className = 'mg-badge on'; b.textContent = mgT().mgHistCurrent; td.appendChild(b);
    } else {
      const btn = document.createElement('button'); btn.className = 'mg-btn'; btn.type = 'button'; btn.textContent = mgT().mgLoadPreview;
      btn.addEventListener('click', () => { buildForm(JSON.parse(JSON.stringify(cfg))); renderModels(); refreshPreview(); scheduleDraftSave(cfg); });
      td.appendChild(btn);
    }
    tr.appendChild(td); tb.appendChild(tr);
  });
}
function renderDiff(){
  const p = MG.preview;
  const body = $('mgDiffBody');
  body.innerHTML = '';
  if(!p) return;
  if(!(p.diff || []).length){
    const dv = document.createElement('p'); dv.className = 'muted small'; dv.textContent = mgT().mgNoChanges; body.appendChild(dv);
  } else {
    const tbl = document.createElement('table'); tbl.className = 'mg-diff-table';
    p.diff.forEach(d => {
      const tr = document.createElement('tr');
      const k = document.createElement('td'); k.className = 'k'; k.textContent = mgFieldLabel(d.key);
      const v = document.createElement('td');
      const o = document.createElement('span'); o.className = 'old'; o.textContent = mgDisplayVal(d.key, d.old_label !== null && d.old_label !== undefined ? d.old : d.old);
      const n = document.createElement('span'); n.className = 'new'; n.textContent = (d.new === null || d.new === undefined) ? mgT().mgRemoved : mgDisplayVal(d.key, d.new);
      v.append(o, document.createTextNode(' → '), n);
      tr.append(k, v); tbl.appendChild(tr);
    });
    // 镜像没变也明说，和效果图口径一致。
    if(!p.diff.some(d => d.key === 'image')){
      const tr = document.createElement('tr');
      const k = document.createElement('td'); k.className = 'k'; k.textContent = mgFieldLabel('image');
      const v = document.createElement('td'); v.textContent = mgT().mgImageUnchanged;
      tr.append(k, v); tbl.appendChild(tr);
    }
    body.appendChild(tbl);
  }
  const n = (MG.data.live && MG.data.live.in_flight) || 0;
  $('mgDiffWarn').textContent = '⚠ ' + mgT().mgDiffWarn.replace('{n}', n);
  $('mgComposePre').textContent = p.compose_preview || '';
}
const _mgModal = $('mgDiffModal');
$('mgPreviewBtn').addEventListener('click', () => { renderDiff(); _mgModal.classList.add('open'); });
$('mgDiffClose').addEventListener('click', () => _mgModal.classList.remove('open'));
$('mgDiffCancel').addEventListener('click', () => _mgModal.classList.remove('open'));
_mgModal.addEventListener('click', e => { if(e.target === _mgModal) _mgModal.classList.remove('open'); });
$('mgForm').addEventListener('submit', e => e.preventDefault());
document.querySelector('#langSel').addEventListener('change', () => {
  if(MG.data){
    const cfg = collectForm();
    renderConsoleAll(cfg);
  }
});
try{
  if(localStorage.getItem('ninfer-panel-view') === 'manage') switchView('manage');
}catch(e){}
</script>
